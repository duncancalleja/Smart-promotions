name: Exclusivity targeting — weekly boltable

on:
  workflow_dispatch: {}
  schedule:
    # Cron is UTC. Monday 06:30 UTC ≈ 08:30 Malta (CEST).
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  group: exclusivity-boltable
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup GitHub CLI
        uses: cli/cli@v2

      - name: Live build + deploy to boltable
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          MT_PORTFOLIO_GH_TOKEN: ${{ secrets.MT_PORTFOLIO_GH_TOKEN }}
          GH_TOKEN: ${{ secrets.MT_PORTFOLIO_GH_TOKEN }}
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: bash scripts/exclusivity_ci_refresh.sh
